<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>It's over 9000</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <input type="text" id="left">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
    </select>

    <input type="text" id="right">

    <input type="button" value="Try me!" id="try">

    <script>
        $(document).ready(function () {

            $("#try").on("click", function () {

                let a = Number($("#left").val());
                let b = Number($("#right").val());
                let op = $("#operator").val();

                if (
                    !Number.isInteger(a) || !Number.isInteger(b) ||
                    a < 0 || b < 0
                ) {
                    alert("Error :(");
                    return;
                }

                if ((op === "/" || op === "%") && b === 0) {
                    alert("It's over 9000 !");
                    console.log("It's over 9000 !");
                    return;
                }

                let result;

                if (op === "+") result = a + b;
                else if (op === "-") result = a - b;
                else if (op === "*") result = a * b;
                else if (op === "/") result = a / b;
                else if (op === "%") result = a % b;

                alert(result);
                console.log(result);
            });

            setInterval(function () {
                alert("Please, use me...");
            }, 30000);

        });
    </script>

</body>
</html>
